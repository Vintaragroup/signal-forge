# SignalForge — Production Docker Compose
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.production → .env and fill in all secrets
#   2. Ensure SIGNALFORGE_JWT_SECRET and SIGNALFORGE_API_KEY are set
#   3. Run: docker compose -f docker-compose.prod.yml build

x-signalforge-env: &signalforge-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  GPT_AGENT_ENABLED: ${GPT_AGENT_ENABLED:-false}
  MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/signalforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  LINKEDIN_COOKIE: ${LINKEDIN_COOKIE:-}
  # Phase 6X — LinkedIn OAuth publish (real path; simulated when unset)
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8000/connect/linkedin/callback}
  X_API_KEY: ${X_API_KEY:-}
  APIFY_TOKEN: ${APIFY_TOKEN:-}
  SERPAPI_KEY: ${SERPAPI_KEY:-}
  # Phase 6Z — Tavily trend/content discovery search (read-only, disabled by default)
  TAVILY_ENABLED: ${TAVILY_ENABLED:-false}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  # Pillar 2 — Instagram OAuth publish (real path; simulated when unset)
  INSTAGRAM_ENABLED: ${INSTAGRAM_ENABLED:-false}
  INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
  INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
  INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-http://localhost:8000/connect/instagram/callback}
  INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}
  SIGNALFORGE_ENV: production
  VAULT_PATH: /vault
  PYTHONPATH: /app
  # Phase 6U: production hardening
  SIGNALFORGE_AUTH_ENABLED: ${SIGNALFORGE_AUTH_ENABLED:-true}
  SIGNALFORGE_JWT_SECRET: ${SIGNALFORGE_JWT_SECRET}
  SIGNALFORGE_JWT_EXPIRY_HOURS: ${SIGNALFORGE_JWT_EXPIRY_HOURS:-24}
  SIGNALFORGE_API_KEY: ${SIGNALFORGE_API_KEY}
  SIGNALFORGE_RATE_LIMIT_ENABLED: ${SIGNALFORGE_RATE_LIMIT_ENABLED:-true}
  # Media & rendering
  FFMPEG_ENABLED: ${FFMPEG_ENABLED:-true}
  FFMPEG_OUTPUT_DIR: /tmp/signalforge_renders
  RUNWAY_ENABLED: ${RUNWAY_ENABLED:-false}
  RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
  RUNWAY_IMAGE_MODEL: ${RUNWAY_IMAGE_MODEL:-gen4_image}
  RUNWAY_IMAGE_RATIO: ${RUNWAY_IMAGE_RATIO:-1080:1920}
  # Pillar 3 — Stripe Checkout for digital-asset sales (disabled by default;
  # simulated checkout URL when unset, card data never touches this server)
  STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SIGNALFORGE_PUBLIC_BASE_URL: ${SIGNALFORGE_PUBLIC_BASE_URL:-http://localhost:5174}
  COMFYUI_ENABLED: ${COMFYUI_ENABLED:-false}
  COMFY_CLOUD_ENABLED: ${COMFY_CLOUD_ENABLED:-false}
  YTDLP_ENABLED: ${YTDLP_ENABLED:-false}
  YTDLP_OUTPUT_DIR: /tmp/signalforge_downloads
  YTDLP_MAX_DURATION_SECONDS: ${YTDLP_MAX_DURATION_SECONDS:-7200}
  YTDLP_ALLOWED_DOMAINS: ${YTDLP_ALLOWED_DOMAINS:-youtube.com,youtu.be}
  TRANSCRIPT_PROVIDER: ${TRANSCRIPT_PROVIDER:-stub}
  TRANSCRIPT_LIVE_ENABLED: ${TRANSCRIPT_LIVE_ENABLED:-false}
  WHISPER_MODEL: ${WHISPER_MODEL:-base}
  AUTO_SCORE_SNIPPETS: ${AUTO_SCORE_SNIPPETS:-false}
  SNIPPET_SCORE_THRESHOLD: ${SNIPPET_SCORE_THRESHOLD:-6}

services:
  mongo:
    image: mongo:8.2.7
    container_name: signalforge-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: signalforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: signalforge-api
    restart: always
    ports:
      - "8000:8000"
    environment: *signalforge-env
    volumes:
      - ./vault:/vault
      - ./data:/data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: signalforge-worker
    restart: always
    command: python3 -u worker.py
    environment: *signalforge-env
    volumes:
      - ./vault:/vault
      - ./data:/data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      target: prod
    container_name: signalforge-web
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
