server {
    listen 80;
    server_name _;

    # Allow large media uploads to pass through to the API (media intake).
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any route that is not a static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: strip the /api prefix and forward to the api service.
    # The trailing slash on proxy_pass replaces the matched /api/ with /.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream file/media responses and uploads without buffering the whole
        # body, so byte-range requests (video seeking) pass through cleanly.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
