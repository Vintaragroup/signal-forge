# Local developer convenience ONLY.
#
# `docker compose` (and `podman compose`) auto-load this file on top of
# docker-compose.yml. Deployed environments (dev/test/prod) do NOT use it —
# they run the production-shape nginx web image from docker-compose.yml,
# unchanged. CI also builds/tests that production image, so this override can
# never hide a bundle-only bug.
#
# It swaps the web service to the Vite dev server (hot reload) and bind-mounts
# the source. The frontend still calls /api; Vite proxies it to the api service
# exactly as nginx does in production, so the code path is identical.
#
# Hot-reload dev UI:  http://localhost:5173
# Production-shape UI (run `... up` without this file): http://localhost:5174

services:
  web:
    build:
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./services/web/src:/app/src
      - ./services/web/index.html:/app/index.html
      - ./services/web/vite.config.js:/app/vite.config.js
      - ./services/web/tailwind.config.js:/app/tailwind.config.js
      - ./services/web/postcss.config.js:/app/postcss.config.js
